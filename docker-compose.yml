services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      MAX_FILE_MB: 2048
      MAX_DURATION_SECONDS: 14400
      MAX_CONCURRENT_JOBS: 2
      JOB_TTL_MINUTES: 30
      ANALYZE_RATE_PER_MINUTE: 20
      DOWNLOAD_RATE_PER_MINUTE: 8
      TRUST_PROXY_HEADERS: "true"
      ENABLE_DENO_RUNTIME: "true"
      ENABLE_NODE_RUNTIME: "false"
    volumes:
      - downloader_data:/app/data

volumes:
  downloader_data:
